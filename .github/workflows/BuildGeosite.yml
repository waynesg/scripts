name: Build MetaCubeX geosite

on:
  schedule:
    - cron: "20 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Build complete geosite.dat
        run: |
          chmod +x scripts/build-geosite.sh
          scripts/build-geosite.sh geodata

      - name: Verify generated files
        run: |
          test -s geodata/geosite.dat
          grep -q "custom-direct" geodata/geosite.dat || true
          test -s geodata/geosite.dat.sha256

      - name: Commit generated geodata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add geodata
          if git diff --cached --quiet; then
            echo "No geodata changes"
          else
            git commit -m "更新 MetaCubeX geosite 数据"
            git push
          fi
