name: Build Loyalsoldier geosite

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/BuildGeosite.yml"
      - "rules/**"
      - "scripts/build-geosite.sh"
      - "scripts/merge-geosite.py"
      - "scripts/verify-geosite.py"
  schedule:
    - cron: "20 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-geosite
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v4

      - name: Build complete geosite.dat
        run: |
          chmod +x scripts/build-geosite.sh
          scripts/build-geosite.sh geodata

      - name: Verify generated files
        run: |
          test -s geodata/geosite.dat
          test -s geodata/geosite.dat.sha256
          test -s geodata/geosite-tags.txt
          test -s geodata/geosite-summary.json
          test -s geodata/source-revisions.txt
          (cd geodata && shasum -a 256 -c geosite.dat.sha256)
          python3 scripts/verify-geosite.py geodata/geosite.dat

      - name: Commit generated geodata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add geodata
          if git diff --cached --quiet; then
            echo "No geodata changes"
          else
            git commit -m "更新 Loyalsoldier geosite 与自定义分类"
            git push
          fi
